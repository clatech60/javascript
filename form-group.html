<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./bootstrap-5.3.5-dist/bootstrap-5.3.5-dist/css/bootstrap.min.css">

    <title>form group</title>
</head>
<body>
    <form class="form-horizontal">
        <div class="form-group">
            <label for="email">email</label>
            <div class="col-sm-10">

                <input type="text" id="email" class="form-control">
            </div>
        </div>
         <div class="form-group">
            <label for="phone">phone</label>
            <div class="col-sm-10">

                <input type="text" id="phone" class="form-control bg-dark text-light">
            </div>
        </div>
    </form>
    <script src="./bootstrap-5.3.5-dist/bootstrap-5.3.5-dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
