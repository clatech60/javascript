<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./bootstrap-5.3.5-dist/bootstrap-5.3.5-dist/css/bootstrap.min.css">
    <title>carousel</title>
    <style>
        
        div{
            display: flex;
        }
        div button{
            margin:10px;
        }
        </style>
</head>
<body>
    <div class="container" style="width:50%;height:400px">
    <div id="myCarousel" class="carousel slide" data-bs-ride="carousel">
        
        <!-- indicators -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2"></button>
            </div>
            
            <!-- wrapper for slides -->
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="./p.png" alt="" class="w-100">
                </div>
                <div class="carousel-item">
                    <img src="./p2.png" alt="" class="w-100">
                </div>
                <div class="carousel-item">
                    <img src="./profile.jpg" alt="" class="w-100">
                </div>
            </div>  
        </div>
       </div> 
        <script src="./bootstrap-5.3.5-dist/bootstrap-5.3.5-dist/js/bootstrap.bundle.min.js"></script>
    
    
</body>
</html>
